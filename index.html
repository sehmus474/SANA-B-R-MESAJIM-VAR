<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Bir Şey Demek İstiyorum...</title>
    
    <!-- WhatsApp ve Instagram Paylaşım Önizleme Ayarları -->
    <meta property="og:title" content="Sana Bir Şey Demek İstiyorum..." />
    <meta property="og:description" content="Görmek için bağlantıya tıkla..." />
    <meta property="og:image" content="https://unsplash.com" />
    <meta property="og:type" content="website" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            transition: all 0.5s ease;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #ff477e;
            font-size: 24px;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .btn {
            background-color: #ff477e;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 5px 15px rgba(255, 71, 126, 0.3);
            text-decoration: none;
            display: inline-block;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }

        .btn-yes { background-color: #2ec4b6; box-shadow: 0 5px 15px rgba(46, 196, 182, 0.3); }
        .btn-no { background-color: #e71d36; box-shadow: 0 5px 15px rgba(231, 29, 54, 0.3); }

        /* Kalp Animasyonu */
        .heart {
            position: absolute;
            color: #ffffff;
            font-size: 24px;
            animation: floatUp 3s linear infinite;
            opacity: 0;
            bottom: 0;
            z-index: 1;
            pointer-events: none;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.1));
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        .hidden { display: none; }
        
        .emoji {
            font-size: 60px;
            margin-top: 15px;
            display: block;
        }
    </style>
</head>
<body>

    <!-- 1. ADIM: KAPAK SAYFASI -->
    <div id="step1" class="container">
        <h1>Sana bir şey demek istiyorum...<br>Görmek için alttaki bağlantıya tıkla</h1>
        <button class="btn" onclick="nextStep()">Bağlantıya Tıkla</button>
    </div>

    <!-- 2. ADIM: TEKLİF SAYFASI -->
    <div id="step2" class="container hidden">
        <h1>Emine, benimle çıkar mısın? 🤍</h1>
        <div class="btn-group">
            <button class="btn btn-yes" onclick="showYes()">Evet</button>
            <button class="btn btn-no" onclick="showNo()">Hayır</button>
        </div>
    </div>

    <!-- 3. ADIM: EVET SONUCU -->
    <div id="step-yes" class="container hidden">
        <h1>Dünyanın en mutlu insanı yaptın beni! 🎉🤍</h1>
    </div>

    <!-- 4. ADIM: HAYIR SONUCU -->
    <div id="step-no" class="container hidden">
        <h1>Canın sağ olsun...</h1>
        <span class="emoji">🥺🤵‍♂️💧</span>
    </div>

    <script>
        function nextStep() {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }

        function showYes() {
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step-yes').classList.remove('hidden');
            setInterval(createHeart, 150);
        }

        function showNo() {
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step-no').classList.remove('hidden');
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '🤍';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 2 + 's';
            heart.style.fontSize = Math.random() * 20 + 20 + 'px';
            document.body.appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 4000);
        }
    </script>
</body>
</html>
